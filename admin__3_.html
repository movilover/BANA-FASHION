window.VD=id=>{OV=id;let w=$('odm');if(!w){w=document.createElement('div');w.id='odm';w.className='fixed inset-0 z-[95] bg-black/75 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4';w.onclick=e=>{if(e.target===w)CVD()};document.body.appendChild(w);document.body.style.overflow='hidden'}ODR(true)};
window.CVD=()=>{OV=null;const w=$('odm');if(w)w.remove();document.body.style.overflow=''};
window.ODR=force=>{if(!OV)return;const w=$('odm');if(!w)return;const o=orders.find(x=>x._id===OV);if(!o){CVD();return}const a=document.activeElement;if(!force&&w.contains(a)&&/INPUT|TEXTAREA/.test(a.tagName))return;const d=w.querySelector('details'),open=d&&d.open,sc=w.querySelector('.odb')?.scrollTop||0;w.innerHTML=odHTML(o);const b=w.querySelector('.odb');if(b)b.scrollTop=sc;const d2=w.querySelector('details');if(d2&&open)d2.open=true};

window.CPY=async(t,b)=>{let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(x){}a.remove()}
 if(ok){toast('কপি হয়েছে ✔');if(b){const h=b.innerHTML;b.innerHTML='<i class="fa-solid fa-check mr-1"></i>কপি হয়েছে';setTimeout(()=>{b.innerHTML=h},1600)}}else toast('ত্রুটি: কপি করা যায়নি','err')};
window.CPO=(id,b)=>{const o=orders.find(x=>x._id===id);if(o)CPY(copyTxt(o),b)};

window.OSMt=()=>{OSM=!OSM;OSEL.clear();draw(true)};
window.OSt=(id,on)=>{on?OSEL.add(id):OSEL.delete(id);const c=$('oc-'+id);if(c)c.classList.toggle('osel',!!on);osUp()};

async function ODel(list){for(let i=0;i<list.length;i+=200){const b=writeBatch(db);list.slice(i,i+200).forEach(o=>b.delete(doc(db,'orders',o._id)));await b.commit()}
 await Promise.allSettled(list.filter(o=>o.orderId).map(o=>deleteDoc(doc(db,'receipts',o.orderId))))}
const dErr=e=>'ডিলিট হয়নি: '+(e.code||e.message)+(e.code==='permission-denied'?' — Firestore Rules-এ অ্যাডমিনের orders delete অনুমতি দিন':'');
window.DOr=id=>{const o=orders.find(x=>x._id===id);if(!o)return;CD('আপনি কি নিশ্চিত যে অর্ডার <b class="text-amber-400">'+esc(o.orderId||'')+'</b> ('+esc(o.customerName||'')+') ডিলিট করতে চান?',async()=>{const c=$('oc-'+id);if(c)c.classList.add('gone');try{await ODel([o]);OSEL.delete(id);if(OV===id)CVD();toast('অর্ডার ডিলিট হয়েছে')}catch(e){if(c)c.classList.remove('gone');toast(dErr(e),'err')}})};
window.ODM=()=>{const l=orders.filter(o=>OSEL.has(o._id));if(!l.length)return;CD('আপনি কি নিশ্চিত যে নির্বাচিত <b class="text-amber-400">'+bn(l.length)+'টি অর্ডার</b> ডিলিট করতে চান?',async()=>{try{await ODel(l);OSEL.clear();toast(bn(l.length)+'টি অর্ডার ডিলিট হয়েছে');draw(true)}catch(e){toast(dErr(e),'err')}})};

window.OS=async(id,s)=>{await updateDoc(doc(db,'orders',id),{status:s});const o=orders.find(x=>x._id===id);if(o)try{await setDoc(doc(db,'receipts',o.orderId),{status:s},{merge:true})}catch(e){}};
window.CS=id=>{const o=orders.find(x=>x._id===id),t=$('ct'+id).value.trim(),n=$('cn'+id).value.trim();return updateDoc(doc(db,'orders',id),{'courier.name':n,'courier.tracking':t}).then(async()=>{if(o)try{await setDoc(doc(db,'receipts',o.orderId),{courier:n,tracking:t},{merge:true})}catch(e){}alert('সেভ হয়েছে')})};
const waLink=o=>'https://wa.me/88'+String(o.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(`আসসালামু আলাইকুম ${o.customerName}, BANA FASHION থেকে আপনার অর্ডার ${o.orderId} (মোট ${tk(o.total)}) পেয়েছি। ${o.courier?.tracking?'কুরিয়ার ট্র্যাকিং: '+o.courier.tracking+'। ':''}ধন্যবাদ!`);

/* ---- Steadfast transport: Cloud Function proxy (recommended) or direct browser call ---- */
const SFH=()=>({'Content-Type':'application/json','Api-Key':C.key,'Secret-Key':C.secret});
async function sf(path,method='GET',body){
 {let tok;try{tok=await au.currentUser.getIdToken()}catch(e){throw new Error('লগইন সেশন নেই, আবার লগইন করুন')}
  let r;try{r=await fetch('/api/sf',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({path,method,body})})}catch(e){throw new Error('সার্ভারের সাথে যোগাযোগ করা যাচ্ছে না (Railway সার্ভার চালু আছে কি?)')}
  let j;try{j=await r.json()}catch(e){throw new Error('সার্ভার থেকে ভুল রেসপন্স (HTTP '+r.status+')')}
  if(j&&j.error&&!j.consignment)throw new Error(j.error);return j}
 let r;try{r=await fetch('https://portal.packzy.com/api/v1/'+path,{method,headers:SFH(),...(body?{body:JSON.stringify(body)}:{})})}catch(e){const x=new Error('ব্রাউজার থেকে Steadfast API ব্লক হয়েছে (CORS)। সেটিংসে "সার্ভার প্রক্সি" চালু করুন।');x.cors=1;throw x}
 let j;try{j=await r.json()}catch(e){throw new Error('Steadfast থেকে ভুল রেসপন্স (HTTP '+r.status+')')}
 return j}
window.SFT=async()=>{try{const j=await sf('get_balance');if(j.current_balance==null)throw new Error(j.message||'কী/সিক্রেট ভুল হতে পারে');toast('কানেকশন ঠিক আছে! Steadfast ব্যালেন্স: ৳'+j.current_balance)}catch(e){toast('ত্রুটি: '+e.message,'err')}};

/* ---- Accept & Book ---- */
window.AB=async(id,btn)=>{const o=orders.find(x=>x._id===id);if(!o||BK.has(id))return;
 if(o.courier?.cid||o.courier?.tracking){toast('এই অর্ডার ইতিমধ্যে বুক করা হয়েছে','err');return}
 if(!C.key||!C.secret){toast('ত্রুটি: আগে সেটিংসে Steadfast API Key ও Secret Key দিন','err');return}
 if(!confirm(`${o.orderId} (${o.customerName}) কনফার্ম করে Steadfast কুরিয়ারে বুক করবেন?\nCOD: ৳${Math.round(COD(o))}`))return;
 BK.add(id);const h=btn?.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>বুকিং হচ্ছে...'}
 try{const j=await sf('create_order','POST',{invoice:o.orderId,recipient_name:o.customerName,recipient_phone:norm(o.phone),recipient_address:fullAddr(o),cod_amount:Math.round(COD(o)),note:o.note||''});
  const c=j.consignment;if(!c||!c.tracking_code)throw new Error(j.message||(j.errors?JSON.stringify(j.errors):'বুকিং ব্যর্থ'));
  await updateDoc(doc(db,'orders',id),{courier:{name:'Steadfast',tracking:c.tracking_code,cid:c.consignment_id,live:c.status||'in_review',bookedAt:Date.now(),syncedAt:Date.now()}});
  try{await setDoc(doc(db,'receipts',o.orderId),{courier:'Steadfast',tracking:c.tracking_code,live:c.status||'in_review'},{merge:true})}catch(e){}
  await OS(id,'confirmed');toast('বুকিং সফল! ট্র্যাকিং: '+c.tracking_code);SND.ok()}
 catch(e){toast('ত্রুটি: '+(e.message||e),'err')}
 finally{BK.delete(id);if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=h}}};

/* ---- status sync (manual / every 3 min while panel is open; webhook handles it when panel is closed) ---- */
window.SFSync=async(id,silent,btn)=>{const o=orders.find(x=>x._id===id);if(!o?.courier?.cid){if(!silent)toast('ত্রুটি: Steadfast consignment ID নেই','err');return false}
 const h=btn?.innerHTML;if(btn){btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-1"></i>সিঙ্ক...'}
 try{const j=await sf('status_by_cid/'+o.courier.cid,'GET'),st=j.delivery_status;if(!st)throw new Error(j.message||'স্ট্যাটাস পাওয়া যায়নি');
  if(st!==o.courier.live||!silent){await updateDoc(doc(db,'orders',id),{'courier.live':st,'courier.syncedAt':Date.now()});
  try{await setDoc(doc(db,'receipts',o.orderId),{live:st},{merge:true})}catch(e){}}
  const ns=SFM[st];if(ns&&RK_[ns]>RK_[o.status])await OS(id,ns);
  if(!silent)toast('Steadfast: '+(SFL[st]||st));return true}
 catch(e){if(!silent)toast('ত্রুটি: '+e.message,'err');return false}
 finally{if(btn&&btn.isConnected){btn.disabled=false;btn.innerHTML=h}}};
window.SFAll=async manual=>{if(SYN)return;const l=orders.filter(o=>o.courier?.cid&&['confirmed','shipped'].includes(o.status));if(!l.length){if(manual)toast('সিঙ্ক করার মতো অর্ডার নেই');return}
 SYN=1;try{let ok=0;for(const o of l.slice(0,40)){const r=await SFSync(o._id,!manual);if(r)ok++;else if(!manual)break;await new Promise(r=>setTimeout(r,250))}if(manual)toast(bn(ok)+'/'+bn(l.length)+' টি অর্ডার সিঙ্ক হয়েছে')}finally{SYN=0}};

/* ===== ImgBB অটো ইমেজ আপলোড — Key সেভ থাকে private/imgbb (শুধু অ্যাডমিন) ===== */

window.RLE=n=>{const d=RL[n],ok=rlOk(d);RD={n,title:ok?d.title:'',price:ok?d.price:'',oldPrice:ok&&d.oldPrice?d.oldPrice:'',stock:ok&&d.stock!=null?d.stock:'',desc:ok?(d.description||''):'',sizes:ok?[...(d.sizes||[])]:['M','L','XL','XXL'],designs:ok?d.designs.map(x=>({name:x.name||'',hex:x.hex||'#cccccc',front:x.front||'',back:x.back||''})):[{name:'',hex:'#111111',front:'',back:''}]};rlDraw()};
window.RLC=()=>{RD=null;const m=$('rlm');if(m)m.remove()};
function rlDraw(){if(!RD)return;let m=$('rlm');if(!m){m=document.createElement('div');m.id='rlm';m.className='fixed inset-0 z-[95] bg-black/80 backdrop-blur-sm overflow-y-auto p-3';document.body.appendChild(m)}
 const SGL=[['অক্ষর সাইজ',['S','M','L','XL','XXL','3XL']],['নম্বর সাইজ',['28','30','32','34','36','38','40']],['অন্যান্য',['Free Size']]];
 const chipS=s=>`<button type="button" class="ch ${RD.sizes.includes(s)?'on':''}" onclick="RLZ(this.dataset.s)" data-s="${esc(s)}">${esc(s)}</button>`;
 const custom=RD.sizes.filter(s=>!SGL.some(g=>g[1].includes(s)));
 const up=(i,k,lab,req)=>{const u=RD.designs[i][k];return`<div><label class="lb">${lab}${req?' <span class="text-red-400">*</span>':' (ঐচ্ছিক)'}</label><label class="flex items-center justify-center rounded-xl border border-dashed border-amber-500/40 cursor-pointer overflow-hidden text-amber-400 text-[11px] font-bold hover:bg-amber-500/5" style="aspect-ratio:4/5;background:#0b0b0e">${u?`<img src="${u}" class="w-full h-full" style="object-fit:contain">`:'<span class="text-center px-2"><i class="fa-solid fa-cloud-arrow-up text-lg block mb-1"></i>ছবি আপলোড</span>'}<input type="file" accept="image/*" class="hidden" onchange="RLF(${i},'${k}',this)"></label>${u&&!req?`<button type="button" class="text-[10px] text-red-400 mt-1" onclick="RD.designs[${i}].back='';rlDraw()">পিছনের ছবি মুছুন</button>`:''}</div>`};
 m.innerHTML=`<div class="c max-w-3xl mx-auto my-3 p-4 sm:p-5" style="background:#111114"><div class="flex justify-between items-center mb-3"><div class="font-bold"><i class="fa-solid fa-grip-lines text-amber-400 mr-2"></i>স্লট ${bn(RD.n)} — প্রোডাক্ট ${rlOk(RL[RD.n])?'এডিট':'যোগ'}</div><button class="bf-x" onclick="RLC()" aria-label="বন্ধ করুন"><i class="fa-solid fa-xmark"></i></button></div>
 <div class="grid sm:grid-cols-3 gap-3"><div class="sm:col-span-3"><label class="lb">প্রোডাক্টের নাম</label><input class="i" value="${esc(RD.title)}" oninput="RD.title=this.value"></div>
 <div><label class="lb">দাম (৳)</label><input class="i" type="number" value="${esc(RD.price)}" oninput="RD.price=this.value"></div><div><label class="lb">আগের দাম (৳)</label><input class="i" type="number" value="${esc(RD.oldPrice)}" oninput="RD.oldPrice=this.value"></div><div><label class="lb">স্টক (ঐচ্ছিক)</label><input class="i" type="number" min="0" value="${esc(RD.stock)}" oninput="RD.stock=this.value"></div></div>
 <div class="mt-4"><div class="flex items-center justify-between mb-2"><label class="lb" style="margin:0">ডিজাইন / কালার (সর্বোচ্চ ৬টি)</label>${RD.designs.length<6?'<button type="button" class="g" onclick="RLA()"><i class="fa-solid fa-plus mr-1"></i>আরেকটি ডিজাইন</button>':''}</div>
 <div class="grid gap-3">${RD.designs.map((x,i)=>`<div class="c p-3"><div class="flex items-center gap-2 mb-2"><span class="w-6 h-6 rounded-full border border-white/30 shrink-0" style="background:${esc(x.hex)}"></span><input class="i" placeholder="কালারের নাম (যেমন Black)" maxlength="24" value="${esc(x.name)}" oninput="RD.designs[${i}].name=this.value"><input type="color" value="${esc(x.hex)}" class="shrink-0" style="width:42px;height:38px;background:none;border:0" oninput="RD.designs[${i}].hex=this.value;this.parentNode.firstChild.style.background=this.value">${RD.designs.length>1?`<button type="button" class="g" style="color:#f87171" onclick="RLD(${i})"><i class="fa-solid fa-trash"></i></button>`:''}</div>
 <div class="flex flex-wrap gap-1.5 mb-2">${CLR.map(([n,h])=>`<button type="button" class="sw" title="${n}" style="background:${h}" onclick="RLK(${i},'${n}','${h}')"></button>`).join('')}</div>
 <div class="grid grid-cols-2 gap-3" style="max-width:360px">${up(i,'front','সামনের ছবি',1)}${up(i,'back','পিছনের ছবি',0)}</div></div>`).join('')}</div></div>
 <div class="mt-4"><label class="lb">সাইজ</label>${SGL.map(([n,a])=>`<div class="mb-2"><div class="text-[10px] text-gray-500 mb-1">${n}</div><div class="flex flex-wrap gap-2">${a.map(chipS).join('')}</div></div>`).join('')}${custom.length?`<div class="flex flex-wrap gap-2 mb-2">${custom.map(chipS).join('')}</div>`:''}<div class="flex gap-2 max-w-xs"><input id="rlcs" class="i" placeholder="অন্য সাইজ লিখুন"><button type="button" class="g" onclick="RLS2()">যোগ</button></div></div>
 <div class="mt-4"><label class="lb">বিবরণ (ঐচ্ছিক)</label><textarea class="i" rows="3" oninput="RD.desc=this.value">${esc(RD.desc)}</textarea></div>
 <div class="text-[10px] text-gray-500 mt-3 leading-relaxed">টিপস: কাপড়ের ছবি সাদা/স্বচ্ছ (PNG) ব্যাকগ্রাউন্ডে দিলে সবচেয়ে সুন্দর দেখাবে, যেন সত্যিই হ্যাঙ্গারে ঝুলছে। ছবি অটো ছোট করে সেভ হবে।</div>
 <div class="flex gap-2 mt-4"><button class="b" id="rlsv" onclick="RLSV()"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>সেভ করুন</button><button class="g" onclick="RLC()">বাতিল</button></div></div>`}
window.RLA=()=>{if(RD.designs.length<6){RD.designs.push({name:'',hex:'#111111',front:'',back:''});rlDraw()}};
window.RLD=i=>{RD.designs.splice(i,1);rlDraw()};
window.RLK=(i,n,h)=>{RD.designs[i].name=n;RD.designs[i].hex=h;rlDraw()};
window.RLZ=s=>{RD.sizes=RD.sizes.includes(s)?RD.sizes.filter(x=>x!==s):[...RD.sizes,s];rlDraw()};
window.RLS2=()=>{const e=$('rlcs'),v=(e.value||'').trim().replace(/[^\w\s.-]/g,'');if(v&&!RD.sizes.includes(v)){RD.sizes.push(v);rlDraw()}};
window.RLF=async(i,k,el)=>{const f=el.files[0];if(!f)return;try{RD.designs[i][k]=await rimg(f);rlDraw()}catch(e){toast('ছবি পড়া যায়নি','err')}};
window.RLSV=async()=>{if(!RD)return;const t=RD.title.trim();if(!t){alert('প্রোডাক্টের নাম লিখুন');return}if(!(+RD.price>0)){alert('দাম লিখুন');return}
 const ds=RD.designs.filter(x=>x.front);if(!ds.length){alert('কমপক্ষে একটি ডিজাইনের সামনের ছবি দিন');return}if(!RD.sizes.length){alert('অন্তত একটি সাইজ বাছাই করুন');return}
 const data={title:t,price:+RD.price,description:RD.desc.trim(),sizes:RD.sizes,designs:ds.map((x,i)=>({name:(x.name||'').trim()||('Design '+(i+1)),hex:x.hex||'#cccccc',front:x.front,back:x.back||''})),active:true,removed:false,updatedAt:serverTimestamp()};
 if(+RD.oldPrice>0)data.oldPrice=+RD.oldPrice;if(RD.stock!==''&&!isNaN(+RD.stock))data.stock=+RD.stock;
 if(JSON.stringify(data.designs).length>900000){alert('ছবিগুলোর সাইজ অনেক বড় হয়ে গেছে (১ MB সীমা)। ডিজাইন বা পিছনের ছবি কমান।');return}
 const bt=$('rlsv');bt.disabled=true;bt.textContent='সেভ হচ্ছে...';
 try{await setDoc(doc(db,'settings','rail_'+RD.n),data);toast('হ্যাঙ্গারে সেভ হয়েছে');RLC();draw(true)}catch(e){bt.disabled=false;bt.textContent='সেভ করুন';toast('ত্রুটি: '+e.message,'err');alert('সেভ হয়নি: '+e.message)}};
</script><script src="app-shell.js"></script>
<script id="bf-lock">
/* page behind an open sheet / invoice is frozen; Esc closes the top-most invoice */
(function(){
  var IDS=['odm','invWrap','rlm'], on=false, y=0;
  function any(){ for(var i=0;i<IDS.length;i++){ if(document.getElementById(IDS[i])) return true; } return false; }
  function lock(){ if(on) return; on=true; y=window.pageYOffset||document.documentElement.scrollTop||0; var s=document.body.style; s.position='fixed'; s.top=(-y)+'px'; s.left='0'; s.right='0'; s.width='100%'; document.documentElement.classList.add('bf-lock'); }
  function unlock(){ if(!on) return; on=false; var s=document.body.style; s.position=''; s.top=''; s.left=''; s.right=''; s.width=''; document.documentElement.classList.remove('bf-lock'); try{ window.scrollTo({top:y,left:0,behavior:'instant'}); }catch(e){ window.scrollTo(0,y); } }
  function sync(){ if(any()) lock(); else unlock(); }
  new MutationObserver(sync).observe(document.body,{childList:true});
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return; var w=document.getElementById('invWrap'); if(w){ w.remove(); e.stopImmediatePropagation(); } });
})();
</script>
</body></html>
